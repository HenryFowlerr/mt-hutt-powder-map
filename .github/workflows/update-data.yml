name: Update Data

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update:data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "Update Mt Hutt weather data"
          git push
      - run: npm run build
      - name: Publish refreshed site to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/mt-hutt-gh-pages
          mkdir -p /tmp/mt-hutt-gh-pages
          cp -R dist/. /tmp/mt-hutt-gh-pages/
          cd /tmp/mt-hutt-gh-pages
          git init
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy refreshed Mt Hutt data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
